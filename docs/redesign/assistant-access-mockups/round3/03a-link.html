<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=390">
<title>Link your server</title>
<link rel="stylesheet" href="tokens.css">
</head>
<body><div class="phone"><div class="statusbar"></div>
<div class="navbar"><button class="glass-btn" aria-label="Back"><i data-i="chevL"></i></button></div>
<div class="content no-tabbar">
  <div class="steps" role="img" aria-label="Step 1 of 3, Link"><div class="step now"><div class="bar"></div><span class="lbl">Link</span></div><div class="step "><div class="bar"></div><span class="lbl">Choose</span></div><div class="step "><div class="bar"></div><span class="lbl">Connect</span></div></div>
  <h1 class="screen-title">Link your server</h1>
  <p class="lede">On your server, open <b>Link a phone</b> and point this camera at its code.</p>
  <div class="finder" role="img" aria-label="Camera, looking for a code"><div class="grain"></div><div class="frame"><i class="a"></i><i class="b"></i><i class="c"></i><i class="d"></i></div><div class="cap">Looking for a code</div></div>
  <div class="section-header">Or enter it</div>
  <div class="card" style="display:flex;flex-direction:column;gap:12px">
    <div><p class="field-label">Server</p><div class="field"><span class="ph">pebbleaudio.okgodoit.com</span></div></div>
    <div><p class="field-label">Code</p>
      <div class="code-boxes" aria-label="Code, 8 characters"><span class="box cursor"></span><span class="box"></span><span class="box"></span><span class="box"></span><span class="gap"></span><span class="box"></span><span class="box"></span><span class="box"></span><span class="box"></span></div></div>
    <button class="btn bordered disabled">Link This Phone</button>
  </div>
</div></div>
<script src="chrome.js"></script>
</body></html>
