<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=390">
<title>Code expired</title>
<link rel="stylesheet" href="tokens.css">
<style>
  .scan { display: flex; flex-direction: column; align-items: center; gap: 14px; padding: 18px 16px 16px; }
  .scan .art { width: 100%; height: 132px; border-radius: 10px; background: var(--ground); display: flex; align-items: center; justify-content: center; gap: 18px; color: var(--tertiary); }
  .laptop { width: 132px; height: 88px; border-radius: 8px; background: var(--surface); box-shadow: inset 0 0 0 1.5px var(--chevron); display: flex; flex-direction: column; padding: 8px; gap: 5px; position: relative; }
  .laptop::after { content: ""; position: absolute; left: -12px; right: -12px; bottom: -8px; height: 6px; border-radius: 0 0 6px 6px; background: var(--chevron); }
  .laptop .bar { height: 5px; width: 60%; border-radius: 3px; background: var(--track); }
  .laptop .ttl { font: 600 9px/11px var(--font); color: var(--label); }
  .laptop .qr { width: 44px; height: 44px; align-self: center; color: var(--label); }
  .arrow { color: var(--chevron); width: 22px; height: 22px; }
  .ph { width: 54px; height: 96px; border-radius: 12px; box-shadow: inset 0 0 0 1.5px var(--chevron); background: var(--surface); display: flex; align-items: center; justify-content: center; color: var(--tint); }
  .ph svg { width: 26px; height: 26px; }
  .how { font: var(--f-sub-body); color: var(--secondary-body); text-align: center; margin: 0; }
  .how b { font-weight: 600; color: var(--label); }
  .or { display: flex; align-items: center; gap: 10px; font: var(--f-footnote); color: var(--meta-ink); padding: 2px 4px; }
  .or::before, .or::after { content: ""; flex: 1; height: 0.5px; background: var(--hairline); }
  .manual { display: flex; flex-direction: column; gap: 12px; }
  .err { background: var(--attention-fill); border-radius: 10px; padding: 10px 12px; }
</style></head>

        <i data-i="arrowR" class="arrow"></i>
        <div class="ph"><i data-i="camera"></i></div>
      </div>
      <p class="how">On your server's admin page, open <b>Link a phone</b> and scan its code.</p>
      <button class="btn filled"><i data-i="camera" style="width:20px;height:20px"></i>Scan New Code</button>
    </div>
    <div class="or">or enter the code</div>
    <div class="card manual">
      <div><p class="field-label">Server</p><div class="field">pebbleaudio.okgodoit.com</div></div>
      <div><p class="field-label">Code</p>
        <div class="code-boxes error" aria-label="Code, expired">
          <span class="box">K</span><span class="box">7</span><span class="box">Q</span><span class="box">M</span>
          <span class="gap"></span>
          <span class="box">2</span><span class="box">X</span><span class="box">P</span><span class="box">A</span>
        </div>
      </div>
      <div class="err" role="alert"><div class="state-head"><span class="dot attention"></span>That code has expired</div><p class="state-line" style="margin-top:4px">Codes last ten minutes. Open Link a phone again for a new one.</p></div>
