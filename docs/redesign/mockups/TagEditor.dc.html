        <svg width="10" height="10" viewBox="0 0 10 10" fill="none"><path d="M1.5 1.5 L8.5 8.5 M8.5 1.5 L1.5 8.5" stroke="#5B5BD6" stroke-width="1.6" stroke-linecap="round"/></svg>
