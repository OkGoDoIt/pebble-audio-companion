<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    body { margin: 0; font-family: -apple-system, 'SF Pro Text', system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
    a { color: #5B5BD6; } a:hover { color: #4A4AC4; }
  </style>
</helmet>
<div style="width: 390px; height: 844px; background: #F2F2F7; color: #1C1C1E; display: flex; flex-direction: column; overflow: hidden;">

  <div style="flex: 1 1 auto; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 20px; padding: 54px 32px 0;">

    <!-- Watch face showing the consent prompt -->
    <div style="display: flex; flex-direction: column; align-items: center;">
      <div style="width: 148px; height: 26px; background: #D9D9DE; border-radius: 8px 8px 0 0;"></div>
      <div style="width: 190px; height: 190px; border-radius: 22px; background: #1C1C1E; display: flex; align-items: center; justify-content: center; padding: 10px;">
        <div style="width: 100%; height: 100%; background: #FFFFFF; border-radius: 6px; display: flex; flex-direction: column; padding: 12px 12px 10px; gap: 6px;">
          <span style="font-size: 11px; font-weight: 700; letter-spacing: 0.3px; color: #1C1C1E;">AUDIO COMPANION</span>
          <span style="font-size: 13px; line-height: 1.35; color: #1C1C1E; flex: 1 1 auto;">Allow this phone to receive watch audio?</span>
          <div style="display: flex; flex-direction: column; gap: 4px;">
            <span style="font-size: 12px; font-weight: 700; color: #1C1C1E; text-align: right;">Allow ›</span>
            <span style="font-size: 12px; color: #8A8A8E; text-align: right;">Decline ›</span>
          </div>
        </div>
      </div>
      <div style="width: 148px; height: 26px; background: #D9D9DE; border-radius: 0 0 8px 8px;"></div>
    </div>

    <div style="font-size: 28px; font-weight: 700; letter-spacing: -0.3px; text-align: center;">Confirm on your watch</div>
    <div style="display: flex; align-items: center; gap: 8px;">
      <span style="width: 8px; height: 8px; border-radius: 4px; background: #5B5BD6;"></span>
      <span style="font-size: 15px; color: #6E6E73;">Waiting for your Pebble…</span>
    </div>
  </div>

  <div style="flex: 0 0 auto; display: flex; flex-direction: column; align-items: center; padding: 0 24px 44px;">
    <span style="font-size: 17px; color: #5B5BD6; padding: 12px;">Cancel</span>
  </div>

</div>
</x-dc>
</body>
</html>
