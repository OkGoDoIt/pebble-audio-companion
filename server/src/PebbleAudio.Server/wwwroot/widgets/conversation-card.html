<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Conversation</title>
<style>
/* @include css/tokens.css */
/* @include widgets/widget.css */
</style>
</head>
<body>
<div class="w-root"><article class="w" id="card" aria-live="polite"></article></div>
<script type="module">
// @include js/view/format.js
// @include widgets/bridge.js
// @include widgets/summary.js

// The conversation card: what get_conversation found, in the app's words, with a way to open it.
const card = document.getElementById('card');
const PERSON = '<svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><circle cx="6" cy="3.6" r="2.4" fill="currentColor"/><path d="M1.5 11c.4-2.6 2.2-4 4.5-4s4.1 1.4 4.5 4z" fill="currentColor"/></svg>';
const CHEVRON = '<svg width="7" height="12" viewBox="0 0 7 12" aria-hidden="true"><path d="M1 1l5 5-5 5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>';

function shapeOf(c) {
  const start = instant(c.startedAt), end = instant(c.endedAt) || start + (c.minutes || 0) * 60000;
  if (!Number.isFinite(start) || !Number.isFinite(end) || end <= start) return '';
  const total = (end - start) / 1000;
  const marks = (c.gaps || []).map((g) => {
    const s = (instant(g.startedAt) - start) / 1000;
    // A hole is drawn to scale; brief drops spread over a stretch are the app's tick where they start, not fourteen
    // minutes of hatching over words that are all there.
    const spread = g.kind === 'lost' && g.missingMinutes != null && g.minutes >= g.missingMinutes * 2;
    const e = spread ? s + 1 : (instant(g.endedAt) - start) / 1000;
    if (!Number.isFinite(s) || !Number.isFinite(e) || e <= 0 || s >= total || e <= s) return '';
    const kind = g.kind === 'lost' ? 'lost' : g.reason === 'watchPause' ? 'paused' : 'quiet';
    return `<i class="${kind}" style="left:${((Math.max(0, s) / total) * 100).toFixed(2)}%;width:${(((Math.min(total, e) - Math.max(0, s)) / total) * 100).toFixed(2)}%"></i>`;
  });
  const labels = [0, .25, .5, .75, 1].map((f, i) => `<span${i === 1 || i === 3 ? ' class="quarter"' : ''}>${esc(clock(start + f * (end - start), c.timeZone, { seconds: total < 120 }))}</span>`).join('');
  const hasQuiet = (c.gaps || []).some(g => g.kind === 'quiet' && g.reason !== 'watchPause');
  const hasPaused = (c.gaps || []).some(g => g.reason === 'watchPause');
  const zone = (c.timeZone || 'UTC').split('/').pop().replaceAll('_', ' ');
  return `<div class="coverage" aria-label="Recording coverage">
    <div class="shape" role="img" aria-label="${esc(`Recording coverage, ${range(start, end, c.timeZone)}. ${holesWords(c)}`)}">${marks.join('')}</div>
    <div class="coverage-axis">${labels}</div>
    <div class="coverage-key"><span><i aria-hidden="true"></i>Recorded</span>
      ${hasQuiet ? '<span><i class="quiet" aria-hidden="true"></i>Quiet</span>' : ''}
      ${hasPaused ? '<span><i class="paused" aria-hidden="true"></i>Paused</span>' : ''}
      ${c.lostMinutes > 0 ? `<span><i class="lost" aria-hidden="true"></i>${esc(duration(c.lostMinutes * 60, { seconds: true }))} missing</span>` : ''}
      <span class="coverage-zone">${esc(zone)} time</span>
    </div></div>`;
}

function holesWords(c) {
  const bits = [];
  if (c.quietMinutes > 0) bits.push(`Quiet ${duration(c.quietMinutes * 60, { seconds: true })}`);
  if (c.lostMinutes > 0) bits.push(`${duration(c.lostMinutes * 60, { seconds: true })} missing`);
  return bits.join(', ');
}

function render({ structuredContent: c }) {
  if (!c) return;
  card.classList.remove('is-expanded');
  if (!c.found) {
    card.innerHTML = `<div class="w-state"><p class="head">Not in your archive</p><p class="line">${esc(c.summary || '')}</p></div>`;
    return;
  }
  const tz = c.timeZone;
  const start = instant(c.startedAt), end = instant(c.endedAt);
  const when = `${esc(shortDay(c.day))} · ${esc(end ? range(start, end, tz) : clock(start, tz))} · ${esc(duration((c.minutes || 0) * 60))}`;
  const people = peopleLine((c.people || []).map((p) => ({ name: p.name })));
  const followUps = (c.followUps || []).filter((f) => f.status === 'open').length;
  card.innerHTML = `
    <div id="card-content">
    <h1 class="w-title${c.title ? '' : ' untitled'}">${esc(c.title || 'Not summarized yet')}</h1>
    <p class="w-kicker" style="margin-top:5px">${when}</p>
    ${summaryHtml(c.overview, c.id)}
    ${people ? `<p class="w-people">${PERSON}<span>${esc(people)}</span></p>` : ''}
    ${(c.tags || []).length ? `<ul class="pills" aria-label="Topics">${c.tags.map((t) => `<li class="pill">${esc(t)}</li>`).join('')}</ul>` : ''}
    <section class="recording-details" aria-label="Recording details"><h2 class="section-label">Recording details</h2>${shapeOf(c)}</section>
    </div>
    <div class="w-foot">
      ${expandButton('card-content')}
      <span class="hint">${followUps ? esc(followUps === 1 ? '1 open follow-up' : `${followUps} open follow-ups`) : ''}</span>
      <a class="w-open" href="${esc(c.url)}" target="_blank" rel="noopener">Open conversation ${CHEVRON}</a>
    </div>`;
  loadExpandedSummaries(card);
  card.querySelector('.w-open').addEventListener('click', (e) => { e.preventDefault(); openLink(c.url); });
}

connectHost({ name: 'Pebble Audio conversation card', onResult: render });
watchSize();
</script>
</body>
</html>
