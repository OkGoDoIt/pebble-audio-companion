<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Clip</title>
<style>
/* @include css/tokens.css */
/* @include css/player.css */
/* @include widgets/widget.css */

/* instrument's compact player with its turns as buttons that light up as they are spoken. */
.w pa-player { margin-top: 12px; }
.w .pl-top { display: none; } /* the kicker already says the clip's times */
.cp-turns { list-style: none; margin: 12px -16px 0; padding: 4px 16px; max-height: 232px; overflow-y: auto; border-top: 0.5px solid var(--hairline); overscroll-behavior: contain; }
.cp-turn {
  display: grid; grid-template-columns: 74px minmax(0, 1fr); gap: 10px; width: calc(100% + 16px); min-height: var(--target);
  margin: 2px -8px; padding: 7px 8px; border: 0; border-radius: 8px; background: none; cursor: pointer; text-align: left;
  transition: background-color 0.2s ease;
}
.cp-turn:hover { background: var(--tint-fill-10); }
.cp-turn.current { background: var(--tint-fill-12); }
.cp-who { font-size: var(--fs-meta); font-weight: 600; padding-top: 2px; line-height: 1.3; }
.cp-who small { display: block; font-weight: 400; color: var(--meta); font-size: var(--fs-micro); font-variant-numeric: tabular-nums; }
.cp-who.s0 { color: var(--lane-0-text); }
.cp-who.s1 { color: var(--lane-1-text); }
.cp-who.s2 { color: var(--lane-2-text); }
.cp-who.s3 { color: var(--lane-3-text); }
.cp-say { margin: 0; font-size: 15px; line-height: 1.4; color: var(--label); }
.is-playing .cp-turn:not(.current) .cp-say { color: var(--tertiary); }
.cp-gap { margin: 6px 0; padding: 0 0 0 84px; font-size: var(--fs-meta); color: var(--quiet-text); }
.cp-gap.lost { color: var(--missing-text); }
@container (max-width: 440px) {
  .cp-turns { margin: 12px -14px 0; padding: 4px 14px; }
  .cp-turn { grid-template-columns: 1fr; gap: 1px; }
  .cp-who small { display: inline; margin-left: 6px; }
  .cp-gap { padding-left: 0; }
}
</style>
</head>
<body>
<div class="w-root"><article class="w" id="widget"></article></div>
<script type="module">
// @include js/view/format.js
// @include js/view/pa-player.js
// @include widgets/bridge.js

// The clip player: get_audio's clip on its own wall clock. The signed audio link arrives in the result's
// _meta (the model never sees it); the turns come from get_conversation for the clip's span.
const root = document.getElementById('widget');
let current = null;

function states(r) {
  switch (r.status) {
    case 'requested':
      return { head: 'Waiting for your phone', line: 'It sends the clip on its next sync.', action: 'Check again', busy: true };
    case 'notAllowed':
      return { head: "Clips aren't allowed", line: 'Allow them on your phone, under Pebble Audio server.' };
    case 'unavailable':
      return {
        gone: { head: 'This audio is no longer on your phone' },
        failed: { head: "This clip couldn't be made", line: 'Try again later.' },
        notDelivered: { head: "Your phone didn't send this clip", line: 'It may have been out of reach.', action: 'Ask again' },
        notFound: { head: "This conversation isn't in your archive" },
      }[r.reason] || { head: 'This audio is no longer on your phone' };
    default:
      return null;
  }
}

async function render({ structuredContent: r, _meta: meta }) {
  if (!r) return;
  current = r;
  const audio = meta?.['pebbleaudio/audio'];
  const a = instant(r.startedAt), b = instant(r.endedAt);
  const tz = Intl.DateTimeFormat().resolvedOptions().timeZone;
  const zone = r.timeZone || zoneOf(r.startedAt) || tz;
  root.innerHTML = `
    <p class="w-kicker">${esc(a && b ? `${shortDay(dayOf(r.startedAt))} · ${range(a, b, zone)}` : '')}</p>
    <h1 class="w-title${r.title ? '' : ' untitled'}">${esc(r.title || 'Not summarized yet')}</h1>
    <pa-player></pa-player>
    <ol class="cp-turns" hidden></ol>
    <div class="w-foot"><span class="hint"></span><a class="w-open" href="${esc(r.url || '#')}" target="_blank" rel="noopener">Open in Pebble Audio</a></div>`;
  root.querySelector('.w-open').addEventListener('click', (e) => { e.preventDefault(); if (r.url) openLink(r.url); });
  const player = root.querySelector('pa-player');
  const len = Math.max(1, (b - a) / 1000);
  const rel = (text) => (instant(text) - a) / 1000;
  // Where the clip's audio has none: what place it on the clock. The scrubber draws the conversation's rows instead
  // (loadTurns), as the phone's transcript shows them, so brief drops are one mark and not a hundred.
  const lost = (r.lost || []).map((g) => [rel(g.startedAt), rel(g.endedAt)]);
  const quiet = (r.quiet || []).map((g) => [rel(g.startedAt), rel(g.endedAt)]);
  const model = { startMs: a, tz: zone, dur: len, span: [0, len], t: 0, lanes: [], turns: [], gaps: [] };
  player.model = model;
  const state = states(r);
  if (r.status === 'ready' && audio?.url) {
    player.source = {
      url: audio.url,
      covered: [r.coveredFrom ? rel(r.coveredFrom) : 0, r.coveredTo ? rel(r.coveredTo) : len],
      lost,
      quiet,
      durationMs: null,
    };
  } else if (state) {
    player.setState(state);
  }
  player.addEventListener('pa-action', recheck);
  if (r.conversationId) loadTurns(r, player, model, a, b);
}

function dayOf(text) {
  // The local date the instant carries in its own offset ("2026-10-14T09:12:00+07:00").
  return text.slice(0, 10);
}

function zoneOf(text) {
  // get_audio gives local offsets, not zone ids: format in a fixed offset when that is all there is.
  const m = /([+-])(\d\d):(\d\d)$/.exec(text || '');
  if (!m) return null;
  const minutes = (Number(m[2]) * 60 + Number(m[3])) * (m[1] === '-' ? -1 : 1);
  // Etc/GMT zones are whole hours with the sign reversed; other offsets fall back to the reader's zone.
  return minutes % 60 === 0 ? `Etc/GMT${minutes > 0 ? '-' : '+'}${Math.abs(minutes / 60)}` : null;
}

async function recheck() {
  const r = current;
  const player = root.querySelector('pa-player');
  player.setState({ head: 'Asking again', busy: true });
  try {
    const result = await callTool('get_audio', { conversation_id: r.conversationId, start: r.startedAt, end: r.endedAt });
    render({ structuredContent: result.structuredContent, _meta: result._meta });
  } catch {
    player.setState({ ...states(r), line: 'Ask your assistant for the clip again.' });
  }
}

async function loadTurns(r, player, model, a, b) {
  let result;
  try {
    result = await callTool('get_conversation', { id: r.conversationId, include: 'transcript', from_time: r.startedAt, to_time: r.endedAt });
  } catch {
    return; // The player works without them.
  }
  const c = result?.structuredContent;
  const items = c?.transcript?.items || [];
  if (!items.length) return;
  model.tz = c.timeZone || model.tz;
  const rel = (text) => (instant(text) - a) / 1000;
  // Lanes as the viewer draws them: named voices by how much they say, unnamed ones gray.
  const talk = new Map();
  const turns = items.filter((i) => i.kind === 'turn');
  turns.forEach((t, i) => {
    const next = turns[i + 1] ? instant(turns[i + 1].at) : instant(t.at) + 6000;
    const key = t.speaker || '?';
    talk.set(key, (talk.get(key) || { s: 0, name: t.name }));
    talk.get(key).s += Math.min(30000, next - instant(t.at)) / 1000;
  });
  const order = [...talk.entries()].sort((x, y) => y[1].s - x[1].s);
  let hue = 0;
  const laneOf = new Map();
  model.lanes = order.slice(0, 4).map(([key, v], i) => {
    laneOf.set(key, i);
    return { name: v.name || `Speaker ${key}`, cls: v.name ? ['s0', 's1', 's2'][Math.min(2, hue++)] : 's3' };
  });
  if (order.length > 4) {
    model.lanes[3] = { name: 'Other voices', cls: 's3' };
    order.slice(3).forEach(([key]) => laneOf.set(key, 3));
  }
  model.turns = turns.map((t, i) => {
    const s = rel(t.at);
    const next = turns[i + 1] ? rel(turns[i + 1].at) : s + 6;
    return [laneOf.get(t.speaker || '?') ?? 0, s, Math.max(s + 1, Math.min(next - 0.3, s + 30))];
  });
  for (const g of c.gaps || []) {
    const s = rel(g.startedAt), lost = g.kind === 'lost';
    // A hole is drawn to scale; brief drops spread over a stretch are the app's tick where they start.
    const spread = lost && g.missingMinutes != null && g.minutes >= g.missingMinutes * 2;
    const e = spread ? s + 1 : rel(g.endedAt);
    if (e <= 0 || s >= model.dur) continue;
    model.gaps.push({ k: lost ? 'lost' : g.reason === 'watchPause' ? 'paused' : 'quiet', s: Math.max(0, s), e: Math.min(model.dur, e), label: g.label });
  }
  const src = player._src;
  player.model = model;
  if (src) player.source = src;

  const list = root.querySelector('.cp-turns');
  list.innerHTML = items.map((item) => {
    const s = rel(item.at);
    if (item.kind === 'turn') {
      const lane = model.lanes[laneOf.get(item.speaker || '?') ?? 0];
      return `<li><button type="button" class="cp-turn" data-t="${s.toFixed(2)}"><span class="cp-who ${lane.cls}">${esc(item.name || `Speaker ${item.speaker}`)}<small>${esc(clock(instant(item.at), model.tz, { seconds: true }))}</small></span><p class="cp-say">${esc(item.text)}</p></button></li>`;
    }
    const minutes = item.minutes ?? (instant(item.endAt) - instant(item.at)) / 60000;
    // Quiet and interrupted rows in the phone's own words ("audio interrupted for 1 min over 14 min (…)").
    const words = item.kind === 'masked'
      ? `${(item.descriptor || 'music')[0].toUpperCase()}${(item.descriptor || 'music').slice(1)} · ${duration(minutes * 60, { seconds: true })}`
      : item.label || (item.kind === 'lost' ? `${duration((item.missingMinutes ?? minutes) * 60, { seconds: true })} missing` : `Quiet · ${duration(minutes * 60, { seconds: true })}`);
    return `<li class="cp-gap ${item.kind}">${esc(words)}</li>`;
  }).join('');
  list.hidden = false;
  const buttons = [...list.querySelectorAll('.cp-turn')];
  buttons.forEach((btn) => btn.addEventListener('click', () => player.cueAt(Number(btn.dataset.t), true)));
  player.addEventListener('pa-time', (e) => {
    root.classList.toggle('is-playing', e.detail.playing);
    const i = e.detail.turn;
    const on = list.querySelector('.cp-turn.current');
    if (on && on !== buttons[i]) on.classList.remove('current');
    if (i >= 0 && buttons[i] && !buttons[i].classList.contains('current')) {
      buttons[i].classList.add('current');
      // Keep the spoken turn in view inside the list, without moving the page.
      const top = buttons[i].offsetTop - list.offsetTop;
      if (top < list.scrollTop || top > list.scrollTop + list.clientHeight - buttons[i].offsetHeight) list.scrollTo({ top: Math.max(0, top - 8), behavior: 'smooth' });
    }
  });
}

connectHost({ name: 'Pebble Audio clip player', onResult: render });
watchSize();
</script>
</body>
</html>
