server {
    listen 80;
    listen [::]:80;
    server_name pebbleaudio.okgodoit.com;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name pebbleaudio.okgodoit.com;

    ssl_certificate /etc/letsencrypt/live/pebbleaudio.okgodoit.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pebbleaudio.okgodoit.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Clip uploads from the phone and sync batches (8 MB cap in the app, headroom here).
    client_max_body_size 64m;

    # A clip names every stretch it has no audio for in X-Clip-Gaps, ~90 bytes each: an hour of
    # watch audio dropping a slice every 2 s is ~170 KB. HTTP/2's default 4 KB per header made
    # nginx kill any clip with more than ~45 gaps before it reached the app (2026-10-22).
    # nginx 1.18 reads the http2_ pair; from 1.19.7 large_client_header_buffers does both.
    http2_max_field_size 1m;
    http2_max_header_size 1m;
    large_client_header_buffers 4 1m;

    access_log /var/log/nginx/pebbleaudio-access.log;
    error_log /var/log/nginx/pebbleaudio-error.log;

    location / {
        proxy_pass http://127.0.0.1:5090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection keep-alive;
        proxy_cache_bypass $http_upgrade;
        # Streamable HTTP responses and multi-round-trip tool calls must not be buffered or cut short.
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
