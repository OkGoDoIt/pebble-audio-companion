server {
    listen 80;
    listen [::]:80;
    server_name pebbleaudio.okgodoit.com;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name pebbleaudio.okgodoit.com;

    ssl_certificate /etc/letsencrypt/live/pebbleaudio.okgodoit.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pebbleaudio.okgodoit.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Clip uploads from the phone and sync batches (8 MB cap in the app, headroom here).
    client_max_body_size 64m;

    access_log /var/log/nginx/pebbleaudio-access.log;
    error_log /var/log/nginx/pebbleaudio-error.log;

    location / {
        proxy_pass http://127.0.0.1:5090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection keep-alive;
        proxy_cache_bypass $http_upgrade;
        # Streamable HTTP responses and multi-round-trip tool calls must not be buffered or cut short.
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
