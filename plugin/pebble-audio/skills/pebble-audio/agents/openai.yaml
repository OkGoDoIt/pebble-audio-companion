interface:
  display_name: "Pebble Audio"
  short_description: "Ask about anything you said, heard, or agreed to."
  default_prompt: "What did I agree to yesterday?"
policy:
  products: ["CHAT", "CODEX"]
  allow_implicit_invocation: true
dependencies:
