name: PebbleAudio
options:
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "26.0"
settings:
  base:
    DEVELOPMENT_TEAM: R73F7TNT65
    MARKETING_VERSION: "2.0.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
packages:
  PebbleAudioKit:
    path: PebbleAudioKit
targets:
  App:
    type: application
    platform: iOS
    sources:
      - path: App
        excludes:
          - "Info.plist"
          - "App.entitlements"
      # Shared/ compiles into the app AND the widget extension. Two files are excluded here:
      # the app already links the kit's `CompanionRuntime.CoverageSnapshot` (the writer), so
      # compiling the widget's dependency-free mirror would shadow it inside the app module —
      # and `WidgetStatusRules.swift` reads that mirror, so it follows it out.
      - path: Shared
        excludes:
          - "CoverageSnapshot.swift"
          - "WidgetStatusRules.swift"
    dependencies:
      - package: PebbleAudioKit
        product: PebbleAudioKit
      - target: Widgets
        embed: true
    settings:
      base:
        INFOPLIST_FILE: App/Info.plist
        CODE_SIGN_ENTITLEMENTS: App/App.entitlements
        PRODUCT_NAME: Pebble Audio
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_KEY_CFBundleDisplayName: Pebble Audio
        CODE_SIGN_STYLE: Automatic
        # App/Assets.xcassets/AppIcon.appiconset — generated by ios/Tools/make_app_icon.swift.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      configs:
        # Dev builds live side-by-side with the old app (plan 6.4). The release build ships
        # as dev.audiocompanion.app and installs OVER the old app — the only path where M8
        # migration and receiver_id_v1 reuse work.
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: dev.audiocompanion.app.dev
        Release:
          PRODUCT_BUNDLE_IDENTIFIER: dev.audiocompanion.app

  # WidgetKit extension: the Today-coverage widget (Home + Lock Screen) and the Control
  # Center capture toggle. It links NOTHING from PebbleAudioKit — it renders the App Group
  # snapshot JSON and writes capture requests through Shared/ (plan 6.8).
  Widgets:
    type: app-extension
    platform: iOS
    sources:
      - path: Widgets
        excludes:
          - "Info.plist"
          - "Widgets.entitlements"
      - path: Shared
      # Design tokens, the string catalog, and the route space are shared verbatim so the
      # widget can never drift into its own colors or its own vocabulary (U9).
      - path: App/DesignSystem/Tokens.swift
      - path: App/DesignSystem/Copy.swift
      - path: App/Router.swift
      # The same intent types Siri and the app use — Control Center must not have its own.
      - path: App/Intents/CaptureIntents.swift
    settings:
      base:
        INFOPLIST_FILE: Widgets/Info.plist
        CODE_SIGN_ENTITLEMENTS: Widgets/Widgets.entitlements
        PRODUCT_NAME: PebbleAudioWidgets
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_KEY_CFBundleDisplayName: Pebble Audio
        CODE_SIGN_STYLE: Automatic
        SKIP_INSTALL: YES
        # `CaptureIntents.swift` compiles into both targets, and one API it needs
        # (`ForegroundContinuableIntent`, used to wake a dead app) is unavailable in app
        # extensions. This flag selects the extension-safe half of that file.
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) WIDGET_EXTENSION"
      configs:
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: dev.audiocompanion.app.dev.widgets
        Release:
          PRODUCT_BUNDLE_IDENTIFIER: dev.audiocompanion.app.widgets

  # Logic / view-model / data-source tests for the App layer.
  #
  # It compiles the App sources itself rather than testing a hosted app: a host application
  # would make every run wait on a full app launch (and on the App Group container, which a
  # test bundle has no entitlement for), and nothing here needs a running app — these are
  # view models, mappers, the router, and the live-vs-mock conformance suite.
  #
  # `PebbleAudioApp.swift` is the one App source excluded: it carries `@main`, which a
  # loadable test bundle has no entry point for. `AppRouter` was moved out of it into
  # `App/AppRouter.swift` precisely so it stays testable. `Assets.xcassets` is excluded
  # because compiling an asset catalog into the test bundle buys nothing and costs seconds.
  AppTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: App
        excludes:
          - "Info.plist"
          - "App.entitlements"
          - "PebbleAudioApp.swift"
          - "Assets.xcassets"
      # Same two exclusions as the App target, for the same reason (see above).
      - path: Shared
        excludes:
          - "CoverageSnapshot.swift"
          - "WidgetStatusRules.swift"
      - path: AppTests
    dependencies:
      - package: PebbleAudioKit
        product: PebbleAudioKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.audiocompanion.app.apptests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Automatic

  # Pure-logic tests for the Shared/ helpers (no app host: nothing here touches UIKit).
  SharedTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Shared
      - path: SharedTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.audiocompanion.app.sharedtests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Automatic

schemes:
  App:
    build:
      targets:
        App: all
        Widgets: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - SharedTests
        - AppTests
    archive:
      config: Release
  SharedTests:
    build:
      targets:
        SharedTests: [test]
    test:
      config: Debug
      targets:
        - SharedTests
  AppTests:
    build:
      targets:
        AppTests: [test]
    test:
      config: Debug
      targets:
        - AppTests
